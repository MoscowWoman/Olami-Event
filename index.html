<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Ханука в OLAMI</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #f4f7fb;
    }
    .hanukkah-banner {
      max-width: 1200px;
      margin: 40px auto;
      padding: 40px;
      border-radius: 24px;
      background: linear-gradient(135deg, #163b88, #2bb3c9);
      color: #fff;
      display: flex;
      gap: 32px;
      align-items: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.18);
    }
    .banner-text { flex: 2; }
    .banner-title {
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 12px;
    }
    .banner-subtitle {
      font-size: 18px;
      margin-bottom: 20px;
    }
    .banner-btn {
      padding: 10px 20px;
      border-radius: 999px;
      background: #ffd86b;
      color: #1c2440;
      text-decoration: none;
      font-weight: 600;
      display: inline-block;
      margin-right: 12px;
    }
    .banner-side {
      flex: 1;
      text-align: center;
    }
    .menorah {
      width: 160px;
      height: 160px;
      background: radial-gradient(circle, #ffeaa7, #f39c12);
      border-radius: 999px;
      margin: auto;
    }
  </style>
</head>
<body>
  <div class="hanukkah-banner">
    <div class="banner-text">
      <div class="banner-title">Ханука в OLAMI: свет, чудо и музыка</div>
      <div class="banner-subtitle">
        Восемь дней огней, пончиков и живого общения.  
        Представь вечер, где мы зажигаем ханукию и говорим о своём внутреннем свете.
      </div>
      <a class="banner-btn" href="https://olami.moscow">Подробнее</a>
    </div>

    <div class="banner-side">
      <div class="menorah"></div>
      <p>Образ Ларисы Долиной используется в учебном проекте.</p>
    </div>
  </div>
</body>
</html>
